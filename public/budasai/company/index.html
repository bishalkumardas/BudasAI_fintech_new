<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Company Report — BUDASAI</title>
<meta name="description" content="Full research report — business model, financials, ratios, risks and opportunities." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/budasai/assets/css/styles.css" />
<style>
  .cover-img { width:100%; max-height:360px; object-fit:cover; border-radius:18px; margin-top:18px; border:1px solid var(--border); }
  .skeleton { color: var(--text-soft); padding:60px 0; text-align:center; }
</style>
</head>
<body>
<div data-component="header"></div>

<section class="page-header">
  <div class="hero-grid-bg"></div>
  <div class="container" style="position:relative;z-index:1">
    <span class="eyebrow"><span class="dot"></span> <span id="c-meta">Company Report</span></span>
    <h1 id="c-title">Loading…</h1>
    <p id="c-summary"></p>
    <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
      <button class="btn btn-primary" id="c-pdf">Download PDF
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      </button>
      <a href="/budasai/research" class="btn btn-ghost">← All Research</a>
    </div>
    <img id="c-cover" class="cover-img" style="display:none" alt=""/>
  </div>
</section>

<section class="section">
  <div class="container" id="c-body">
    <div class="skeleton">Fetching report…</div>
  </div>
</section>

<script src="/budasai/assets/js/dummy-data.js"></script>
<script src="/budasai/assets/js/api.js"></script>
<script src="/budasai/assets/js/main.js"></script>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get('slug') || '';
const ticker = params.get('ticker') || '';

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function areaSvg(series, color) {
  if (!series || !series.length) return '';
  const w=600,h=240,pl=40,pr=12,pt=16,pb=24;
  const max=Math.max(...series), min=Math.min(0,...series);
  const xs=i=>pl+(w-pl-pr)*(i/(series.length-1));
  const ys=v=>h-pb-(h-pt-pb)*((v-min)/(max-min||1));
  const d=series.map((v,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
  const area=d+` L${xs(series.length-1)},${h-pb} L${xs(0)},${h-pb} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%"><path d="${area}" fill="${color}" opacity=".18"/><path d="${d}" stroke="${color}" stroke-width="2.2" fill="none"/></svg>`;
}

function render(r) {
  if (!r) {
    document.getElementById('c-title').textContent = 'Report not found';
    document.getElementById('c-summary').textContent = 'Configure the /api/research endpoint in Admin, or check the slug/ticker in the URL.';
    document.getElementById('c-body').innerHTML = '';
    return;
  }
  document.title = (r.company_name || r.title) + ' — BUDASAI';
  document.getElementById('c-meta').textContent = `${r.type || 'Report'} · ${r.country || ''} · ${r.sector || ''}`;
  document.getElementById('c-title').innerHTML = `${esc(r.company_name || r.title)} <span class="gradient-text">— ${esc(r.title || '')}</span>`;
  document.getElementById('c-summary').textContent = r.summary || '';
  if (r.image_url) { const img = document.getElementById('c-cover'); img.src = r.image_url; img.alt = r.company_name || r.title; img.style.display = 'block'; }

  const ratios = r.ratios || {};
  const ratioHtml = Object.keys(ratios).length ? `
    <div class="glass" style="padding:24px">
      <h3 style="margin:0 0 14px">Key Ratios</h3>
      <div class="ratio-grid">
        ${Object.entries(ratios).map(([k,v]) => `<div class="ratio"><div class="lbl">${esc(k.toUpperCase())}</div><div class="val">${esc(v)}</div></div>`).join('')}
      </div>
    </div>` : '';

  const charts = (r.revenue_series || r.profit_series) ? `
    <div class="two-col mt-6">
      ${r.revenue_series ? `<div class="glass" style="padding:26px"><h3>Revenue</h3><div class="chart-wrap">${areaSvg(r.revenue_series,'rgb(47,128,255)')}</div></div>` : ''}
      ${r.profit_series ? `<div class="glass" style="padding:26px"><h3>Profit</h3><div class="chart-wrap">${areaSvg(r.profit_series,'rgb(16,185,129)')}</div></div>` : ''}
    </div>` : '';

  const lists = (r.risks || r.opportunities) ? `
    <div class="two-col mt-6">
      ${r.risks ? `<div class="glass" style="padding:26px"><h3>Risks</h3><ul class="list-clean">${r.risks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${r.opportunities ? `<div class="glass" style="padding:26px"><h3>Opportunities</h3><ul class="list-clean">${r.opportunities.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    </div>` : '';

  document.getElementById('c-body').innerHTML = `
    <div class="company-hero">
      <div class="glass" style="padding:28px">
        <h2>Overview</h2>
        <p>${esc(r.overview || r.summary || '')}</p>
        ${r.business_model ? `<h3 style="margin-top:24px">Business Model</h3><p>${esc(r.business_model)}</p>` : ''}
      </div>
      ${ratioHtml}
    </div>
    ${charts}
    ${lists}
    <div class="glass mt-6" style="padding:26px">
      <h3>Disclaimer</h3>
      <p class="muted" style="margin-bottom:0">Educational purposes only. Not personalised investment advice.</p>
    </div>`;
}

async function loadPdf() {
  const btn = document.getElementById('c-pdf');
  const cfg = window.BUDASAI_API.getConfig();
  const url = window.BUDASAI_API.fullUrl('company_pdf');
  if (!url) { alert('Please connect your FastAPI backend in Admin to download the report.'); return; }
  btn.disabled = true; const orig = btn.innerHTML; btn.textContent = 'Generating…';
  try {
    const headers = { 'Accept': 'application/pdf', 'Content-Type': 'application/json' };
    if (cfg.auth) headers['Authorization'] = cfg.auth;
    const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify({ ticker }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = (ticker || 'report') + '.pdf';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 4000);
  } catch (e) {
    alert('PDF download failed: ' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = orig;
  }
}

async function init() {
  document.getElementById('c-pdf').addEventListener('click', loadPdf);
  const list = await window.BUDASAI_API.fetchData('research');
  if (!Array.isArray(list)) {
    document.getElementById('c-title').textContent = 'Connect your API';
    document.getElementById('c-summary').innerHTML = 'Please connect your FastAPI backend in <a href="/budasai/admin" style="color:var(--electric)">Admin</a> to load this report.';
    document.getElementById('c-body').innerHTML = '';
    return;
  }
  let item = null;
  item = list.find(x => (slug && x.slug === slug) || (ticker && x.ticker === ticker)) || null;
  render(item);
}
document.addEventListener('DOMContentLoaded', init);
</script>
<div data-component="footer"></div>
</body></html>
